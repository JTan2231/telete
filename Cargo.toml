[package]
name = "telete"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Rust CI orchestration for repository workflows and Cell"

[workspace]
members = [
    ".",
    "support/cell/deployment/crates/cell-install",
    "support/cell/infrastructure/chancery/crates/chancery",
    "support/cell/infrastructure/chancery/crates/chancery-usage",
    "support/cell/infrastructure/iatreion/crates/iatreion-api",
    "support/cell/infrastructure/usher/crates/usher",
]
default-members = ["."]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.package]
version = "0.5.8"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
cell-install = { path = "support/cell/deployment/crates/cell-install" }
chancery-usage = { path = "support/cell/infrastructure/chancery/crates/chancery-usage" }
iatreion-api = { path = "support/cell/infrastructure/iatreion/crates/iatreion-api" }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1.4"
unicode-normalization = "0.1.24"
uuid = { version = "1.18", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
anyhow = "1.0"
cell-install.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
fs2.workspace = true
tempfile.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio.workspace = true
toml.workspace = true
libc.workspace = true
rustix = { version = "1.1", features = ["fs", "process"] }
chancery = { path = "support/cell/infrastructure/chancery/crates/chancery" }
usher = { path = "support/cell/infrastructure/usher/crates/usher" }

[lints.rust]
unsafe_code = "deny"
