[package]
name = "telete"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Committed-source CI for repository workflows"
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.18", features = ["v7"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
